name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint, typecheck, and test
        run: bun run check

      - name: Build web
        run: bun run --filter web build

  # The npm package tarball gets the same treatment the binary had: build it
  # once, then smoke the packed artifact on both ship targets so a packaging
  # regression can never land. The job names and shape mirror
  # release-npm.yml, which repeats these smokes against the release tag
  # before publishing; here they run on every PR. Contract tests for the
  # package dir run inside `bun run check`.
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and pack the npm package
        run: |
          bun run build:package
          (cd dist/yuekbox && npm pack)

      - name: Upload the tarball
        uses: actions/upload-artifact@v4
        with:
          name: yuekbox-tarball
          path: dist/yuekbox/yuekbox-*.tgz
          if-no-files-found: error

  smoke-linux:
    runs-on: ubuntu-latest
    needs: package
    steps:
      - name: Checkout the smoke script
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Download the tarball
        uses: actions/download-artifact@v4
        with:
          name: yuekbox-tarball
          path: dist/yuekbox

      - name: Smoke-test the packed tarball
        run: ./scripts/smoke-package.sh

  smoke-darwin:
    runs-on: macos-14
    needs: package
    steps:
      - name: Checkout the smoke script
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Download the tarball
        uses: actions/download-artifact@v4
        with:
          name: yuekbox-tarball
          path: dist/yuekbox

      - name: Smoke-test the packed tarball
        run: ./scripts/smoke-package.sh
