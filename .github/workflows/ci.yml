name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Lint, typecheck, and test
        run: bun run check

      - name: Build web
        run: bun run --filter web build

  # The npm package tarball gets the same treatment the binary had: build it,
  # pack it, and smoke the packed artifact on both ship targets so a packaging
  # regression can never land. The release path (release-npm.yml) repeats
  # these smokes against the release tag before publishing. Contract tests for
  # the package dir run inside `bun run check`.
  smoke-package:
    strategy:
      # One platform failing must not cancel the other's result.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and pack the npm package
        run: |
          bun run build:package
          (cd dist/yuekbox && npm pack)

      - name: Smoke-test the packed tarball
        run: ./scripts/smoke-package.sh
