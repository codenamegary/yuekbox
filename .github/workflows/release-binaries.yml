name: Release Binaries

# Builds the prebuilt executables for a GitHub release, called by the Release
# Please workflow right after it creates the release as a draft. Immutable
# releases only accept assets before publication, so the build jobs attach
# everything to the draft and a final job publishes it; a mid-run failure
# leaves a resumable draft instead of a broken published release. Manual
# dispatch retries a stuck draft. Never runs on pull requests.
#
# One job per ship target: linux-x64 on ubuntu, darwin-arm64 on a native
# macOS arm64 runner (so the smoke test runs the real artifact, and the
# linker's ad-hoc signature is renewed for Gatekeeper). Publishing waits for
# both, so a partial release can never lock.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and publish (for example v0.3.2)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish (for example v0.3.2)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-binaries-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  linux-x64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the linux-x64 binary
        run: bun run build:binary yuekbox-linux-x64

      - name: Smoke-test the compiled binary
        run: ./scripts/smoke-binary.sh ./yuekbox-linux-x64

      - name: Write the SHA-256 checksum
        run: sha256sum yuekbox-linux-x64 > yuekbox-linux-x64.sha256

      # Drafts accept assets; published immutable releases do not. The tag
      # already exists because release-please creates it with the draft.
      - name: Upload the binary, checksum, and installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" yuekbox-linux-x64 yuekbox-linux-x64.sha256 scripts/install.sh --clobber

  darwin-arm64:
    runs-on: macos-14
    timeout-minutes: 45
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build the darwin-arm64 binary
        run: bun run build:binary yuekbox-darwin-arm64 --target bun-darwin-arm64

      # The build may be cross-compiled or cached without a signature; every
      # arm64 binary needs at least an ad-hoc signature to run locally.
      - name: Ad-hoc codesign the binary
        run: codesign --sign - --force yuekbox-darwin-arm64

      - name: Smoke-test the compiled binary
        run: ./scripts/smoke-binary.sh ./yuekbox-darwin-arm64

      - name: Write the SHA-256 checksum
        run: shasum -a 256 yuekbox-darwin-arm64 > yuekbox-darwin-arm64.sha256

      - name: Upload the binary and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" yuekbox-darwin-arm64 yuekbox-darwin-arm64.sha256 --clobber

  publish:
    needs: [linux-x64, darwin-arm64]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Append the packaging note to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-notes-append.sh "$TAG"

      # Publishing last locks the release and its tag to this run's assets.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$TAG" --draft=false
